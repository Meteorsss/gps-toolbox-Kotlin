name: Format source in cloud
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download verified formatter and format Java
        run: |
          curl --fail --location --retry 3 https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_linux-x86-64 -o "$RUNNER_TEMP/java-format"
          echo "c351f587e6dd1f11836be7296894ea2ab3bd91847dbd14101f4f04d390380fe9  $RUNNER_TEMP/java-format" | sha256sum --check
          chmod +x "$RUNNER_TEMP/java-format"
          find app/src -name '*.java' -print0 | xargs -0 "$RUNNER_TEMP/java-format" --replace
      - name: Commit formatting and run verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF_NAME" = "feature/openfreemap-track-insights" || { echo 'This formatter is scoped to the feature branch'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Java sources in GitHub Actions'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          gh workflow run android.yml --ref "$GITHUB_REF_NAME"