name: Android APK
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed PR head SHA (required for feature-branch signing)
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  pull-requests: read
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate explicitly approved feature-branch signing
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: python scripts/verify-pr-release.py
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
      - name: Restore fixed release signing key
        if: github.event_name == 'workflow_dispatch' && github.actor == 'Meteorsss' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/osm-standard-phone-heading') && github.repository == 'Meteorsss/gps-toolbox-Kotlin'
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import os,json,base64,pathlib
          if not os.environ.get('SIGNING_BUNDLE'):
              raise SystemExit('Release dispatch requires the permanent SIGNING_BUNDLE secret.')
          data=json.loads(os.environ['SIGNING_BUNDLE'])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'release.p12'
          path.write_bytes(base64.b64decode(data['keystore']))
          path.chmod(0o600)
          print('::add-mask::'+data['password'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SIGNING_STORE_FILE={path}\nSIGNING_PASSWORD={data["password"]}\n')
          PY
      - name: Verify language and unchanged UI/privacy assets
        run: python scripts/verify-migration.py
      - name: Unit tests, Android lint and debug compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Signed Kotlin release APK (owner-approved manual dispatch only)
        if: env.SIGNING_STORE_FILE != ''
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release signature, ABI, alignment and privacy manifest
        run: python scripts/verify-release.py
      - uses: actions/upload-artifact@v7.0.2
        if: env.SIGNING_STORE_FILE != ''
        with:
          name: StarTrace-release-files
          path: release-files/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StarTrace-build-verification
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: emulator-input
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
      - name: Remove decrypted signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: emulator-input
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android16-device-tests-and-screenshots
          path: device-results/
          retention-days: 30