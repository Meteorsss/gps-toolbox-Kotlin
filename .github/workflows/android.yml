name: Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
      - name: Restore fixed release signing key
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Meteorsss/gps-toolbox-Kotlin'
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import os,json,base64,pathlib
          if not os.environ.get('SIGNING_BUNDLE'):
              print('::notice::SIGNING_BUNDLE is not configured; only debug artifacts will be built.')
              raise SystemExit(0)
          data=json.loads(os.environ['SIGNING_BUNDLE'])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'release.p12'
          path.write_bytes(base64.b64decode(data['keystore']))
          path.chmod(0o600)
          print('::add-mask::'+data['password'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SIGNING_STORE_FILE={path}\nSIGNING_PASSWORD={data["password"]}\n')
          PY
      - name: Unit tests, Android lint and debug compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Signed preview APK (explicit trusted branch dispatch only)
        if: env.SIGNING_STORE_FILE != ''
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release signature and privacy manifest
        run: |
          mkdir -p dist
          if [ -n "$SIGNING_STORE_FILE" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/StarTrace.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk | tee dist/signature.txt
            grep -q 'certificate SHA-256 digest: 8cd33c25b2fd01833a56c0ff2e71a5bcb14d25eaa39046928bca92854edc1098' dist/signature.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/StarTrace-PR-debug.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions dist/*.apk | tee dist/permissions.txt
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' dist/permissions.txt; then exit 1; fi
          grep -q 'android.permission.INTERNET' dist/permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/*.apk > dist/apk-info.txt
          if [ -n "$SIGNING_STORE_FILE" ]; then
            python - <<'PY' | tee dist/abi-report.txt
          import pathlib,struct,zipfile
          apk=next(pathlib.Path('dist').glob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              libs=[n for n in z.namelist() if n.startswith('lib/') and not n.endswith('/')]
              abis=sorted({n.split('/')[1] for n in libs})
              assert abis == ['arm64-v8a'], f'Unexpected ABIs: {abis}'
              for name in libs:
                  data=z.read(name)
                  assert data[:4] == b'\x7fELF' and data[4] == 2 and data[5] == 1, f'Not ELF64 LE: {name}'
                  assert struct.unpack_from('<H',data,18)[0] == 183, f'Not AArch64: {name}'
                  print(f'{name}: ELF64 AArch64')
              print(f'PASS: arm64-v8a only; {len(libs)} verified native libraries')
          PY
            grep -q "^native-code: 'arm64-v8a'$" dist/apk-info.txt
          fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cp README.md dist/README.md
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          if [ -n "$SIGNING_STORE_FILE" ]; then
            mkdir -p release-files
            cp dist/StarTrace.apk release-files/StarTrace.apk
            cp README.md release-files/README.md
            test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 2
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: env.SIGNING_STORE_FILE != ''
        with:
          name: StarTrace-release-files
          path: release-files/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StarTrace-PR-preview-apk
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: emulator-input
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
      - name: Remove decrypted signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: emulator-input
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android16-device-tests-and-screenshots
          path: device-results/
          retention-days: 30