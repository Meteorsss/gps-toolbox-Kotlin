name: Publish verified APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful signed main-branch Android APK run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-kotlin-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Meteorsss/gps-toolbox-Kotlin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate signed build, all tests and exactly two release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: python scripts/publish-release.py
